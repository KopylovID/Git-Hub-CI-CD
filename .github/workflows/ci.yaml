name: CI

on: [push]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
      - name: Анализ кода - ruff
        run: make ruff

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
      - name: Запуск тестов
        run: make test