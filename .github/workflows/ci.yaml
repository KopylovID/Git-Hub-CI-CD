name: CI

on: [push]

permissions:
  contents: read

x-setup: &setup
  - uses: actions/checkout@v4
  - name: Установка Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.13"
  - name: Установка uv
    run: |
      python -m pip install --upgrade pip
      pip install uv
  - name: Установка зависимостей
    run: uv sync

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - *setup
      - name: Анализ кода - ruff
        run: make ruff

  test:
    runs-on: ubuntu-latest
    steps:
      - *setup
      - name: Запуск тестов
        run: make test