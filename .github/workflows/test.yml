name: Запуск тестов

on: [push]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Установка Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Установка uv
      run: |
        python -m pip install --upgrade pip
        pip install uv
    - name: Установка зависимостей
      run: uv sync
    - name: Запуск тестов
      run: make test
